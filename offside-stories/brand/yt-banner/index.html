<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=2560, height=1440" />
<style>
*{margin:0;padding:0;box-sizing:border-box}

#wm{left:520px;top:560px;display:flex;align-items:flex-end}

#st{left:526px;top:800px;font-weight:900;font-size:50px;letter-spacing:.42em}
#tag{left:526px;top:878px;font-weight:800;font-size:32px;letter-spacing:.14em;color:#FFE600}
#ep{left:1640px;top:600px;width:400px;font-family:'League Gothic';font-size:74px;line-height:.95;color:#0A0A0A;text-transform:uppercase;text-align:right}
</style></head>
