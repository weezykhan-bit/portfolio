<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1280, height=720" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#0A0A0A}
#root{position:relative;width:1280px;height:720px;font-family:Inter,sans-serif;color:#F5F5F0;overflow:hidden}
.a{position:absolute}
.lg{font-family:'League Gothic';font-weight:400;line-height:.86;text-transform:uppercase;white-space:nowrap}
#ph{right:0;top:0;width:620px;height:720px;object-fit:cover;object-position:50% 20%}
#sh{right:0;top:0;width:620px;height:720px;background:linear-gradient(90deg,#0A0A0A 0%,rgba(10,10,10,0) 40%)}
#k{left:60px;top:120px;font-weight:900;font-size:34px;letter-spacing:.14em;color:rgba(245,245,240,.75)}
#big{left:52px;top:170px;font-size:330px;color:#FFE600}
#sub{left:60px;top:470px;font-size:120px}
#logo{left:60px;top:618px;display:flex;align-items:center;gap:12px;background:#FFE600;color:#0A0A0A;padding:8px 18px 4px}
#logo .w{font-size:52px}
#logo .s{font-weight:900;font-size:18px;letter-spacing:.36em}
</style></head>
<body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1280" data-height="720" data-no-timeline>
  <img id="ph" class="a" src="assets/vardy.jpg">
  <div id="sh" class="a"></div>
  <div id="k" class="a">LEICESTER CITY 2015–16</div>
  <div id="big" class="a lg">5000–1</div>
  <div id="sub" class="a lg">They won it.</div>
  <div id="logo" class="a"><span class="w lg">OFFSIDE</span><span class="s">STORIES</span></div>
</div>
<script>window.__timelines={};</script>
</body></html>
